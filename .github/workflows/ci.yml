name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-ci:
    name: Backend CI (PHP / Laravel)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: habeshabiz_testing
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_pgsql, bcmath, redis
          coverage: none

      - name: Check Backend Directory
        id: check_backend
        run: |
          if [ -d "backend" ] && [ -f "backend/composer.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Install Composer Dependencies
        if: steps.check_backend.outputs.exists == 'true'
        working-directory: ./backend
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run Laravel Pint (Code Style)
        if: steps.check_backend.outputs.exists == 'true'
        working-directory: ./backend
        run: vendor/bin/pint --test

      - name: Run Static Analysis (Larastan)
        if: steps.check_backend.outputs.exists == 'true'
        working-directory: ./backend
        run: vendor/bin/phpstan analyse --memory-limit=1G

      - name: Run Pest Tests
        if: steps.check_backend.outputs.exists == 'true'
        working-directory: ./backend
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: habeshabiz_testing
          DB_USERNAME: test_user
          DB_PASSWORD: test_password
        run: vendor/bin/pest

  frontend-ci:
    name: Frontend CI (React / TypeScript)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Check Frontend Directory
        id: check_frontend
        run: |
          if [ -d "frontend" ] && [ -f "frontend/package.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Install Dependencies
        if: steps.check_frontend.outputs.exists == 'true'
        working-directory: ./frontend
        run: npm ci

      - name: Run TypeScript Type Check
        if: steps.check_frontend.outputs.exists == 'true'
        working-directory: ./frontend
        run: npm run typecheck

      - name: Build Verification
        if: steps.check_frontend.outputs.exists == 'true'
        working-directory: ./frontend
        run: npm run build
